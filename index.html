<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#8c6a45" />
    <title>Beyond Pages</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Caveat:wght@500;700&family=Special+Elite&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="stage" role="img" aria-label="A handmade indigo journal titled Beyond Pages, lying on a wooden desk"></canvas>
    <button id="open" type="button" hidden>Open the book</button>
    <p id="hint">swipe or drag to turn the page</p>
    <p id="live" class="sr" aria-live="polite"></p>
        <div id="ask" role="dialog" aria-modal="true" aria-labelledby="ask-q" hidden>
      <div class="note">
        <small id="ask-n"></small>
        <p id="ask-q"></p>
        <div class="row">
          <button id="ask-yes" type="button">YES</button>
          <button id="ask-no" type="button">NO</button>
        </div>
        <em id="ask-msg" aria-live="polite"></em>
      </div>
    </div>
    <div id="loader" role="status"><p>Beyond Pages</p><span></span></div>
    <noscript>This experience needs JavaScript.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
